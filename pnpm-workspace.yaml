packages:
  - "apps/*"
  - "packages/*"

# @sentry/nextjs pins its SDK at 10.40.0 but floats @sentry/bundler-plugins,
# which dragged in a SECOND copy of @sentry/core (10.68.0). The bundler plugin
# is never loaded (we do not use withSentryConfig), so collapse both to the
# pinned SDK version rather than ship two Sentry cores.
overrides:
  '@sentry/core': 10.40.0
  # use-intl 4.14.5 (LP3-01) is pinned, but its caret ranges resolved
  # icu-minify and the ICU parser to releases days old. Held at the versions
  # its own release shipped with: icu-minify matches use-intl, and 3.5.18 is
  # the parser intl-messageformat already pins exactly, so one copy remains
  # (owner decision 2026-10-08). Lift them deliberately, not by a re-resolve.
  icu-minify: 4.14.5
  '@formatjs/icu-messageformat-parser': 3.5.18

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  # Source-map upload only — unused until a Sentry auth token exists (Phase 2).
  '@sentry/cli': false
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true
  # eslint-plugin-import-x's native resolver. Its postinstall only links the
  # platform binary that pnpm already installed as an optional dependency;
  # verified that lint resolves `@tonyai/*` workspace imports with it OFF.
  unrs-resolver: false
