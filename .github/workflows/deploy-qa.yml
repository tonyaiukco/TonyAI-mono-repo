name: QA deploy
run-name: QA deploy ${{ github.event.workflow_run.head_sha || github.sha }}
# Owner decision 2026-11-03: every merge to main whose CI passes deploys to the
# hosted QA environment (tonyaiqt-staging-{api,web}, Supabase Cloud project),
# with no approval step. Migrations included. Terraform still owns configuration;
# this workflow changes only image digests (infra/scripts/qa_autodeploy.py).
# Runbook: infra/runbooks/11-qa-hosted.md#automatic-deploy-on-merge.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-deploy
  cancel-in-progress: false
jobs:
  deploy:
    # workflow_run fires for fork pull requests too: only a successful push to
    # this repository's main may reach the OIDC environment.
    if: >-
      github.repository == 'tonyaiukco/TonyAI-mono-repo' && (
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 190
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      RESOURCE_GROUP: ${{ vars.QA_RESOURCE_GROUP }}
      PREFIX: ${{ vars.QA_PREFIX }}
      ACA_DEFAULT_DOMAIN: ${{ vars.QA_ACA_DEFAULT_DOMAIN }}
      ACR_NAME: ${{ vars.QA_ACR_NAME }}
      ACR_HOST: ${{ vars.QA_ACR_NAME }}.azurecr.io
      VAULT_NAME: ${{ vars.QA_VAULT_NAME }}
      SUPABASE_PROJECT_REF: ${{ vars.QA_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: https://${{ vars.QA_SUPABASE_PROJECT_REF }}.supabase.co
      API_ORIGIN: https://${{ vars.QA_PREFIX }}-staging-api.${{ vars.QA_ACA_DEFAULT_DOMAIN }}
      WEB_ORIGIN: https://${{ vars.QA_PREFIX }}-staging-web.${{ vars.QA_ACA_DEFAULT_DOMAIN }}
      # Public, build-time browser key; never a backend/service-role key.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.QA_SUPABASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Before any token exists: a superseded commit never logs in.
      - name: Require this commit to still be main's head
        id: head
        run: python3 infra/scripts/qa_autodeploy.py head --sha "$SOURCE_SHA"
      - if: steps.head.outputs.current == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Decide whether this commit deploys
        id: plan
        if: steps.head.outputs.current == 'true'
        run: |
          if [ "$FORCE" = 'true' ]; then
            python3 infra/scripts/qa_autodeploy.py plan --sha "$SOURCE_SHA" --force
          else
            python3 infra/scripts/qa_autodeploy.py plan --sha "$SOURCE_SHA"
          fi
      - if: steps.plan.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build, push and scan both images
        if: steps.plan.outputs.deploy == 'true'
        timeout-minutes: 45
        run: bash infra/scripts/build-images.sh "$SOURCE_SHA" "$RUNNER_TEMP/candidate.json"
      - name: Apply pending database migrations, then the owner privilege check
        if: steps.plan.outputs.deploy == 'true'
        timeout-minutes: 25
        env:
          # An exact Key Vault version identifier, not the secret value.
          DIRECT_URL_SECRET_VERSION: ${{ vars.QA_DIRECT_URL_SECRET_VERSION }}
        run: python3 infra/scripts/qa_autodeploy.py migrate --sha "$SOURCE_SHA" --candidate "$RUNNER_TEMP/candidate.json"
      # The forward rollout has a 35-minute budget inside the script; the rest of
      # this step's time is reserved for rolling back. Never cancel it midway.
      - name: Roll out API then web, verify and smoke (rolls back on failure)
        if: steps.plan.outputs.deploy == 'true'
        timeout-minutes: 110
        run: python3 infra/scripts/qa_autodeploy.py rollout --sha "$SOURCE_SHA" --candidate "$RUNNER_TEMP/candidate.json"
      - name: Publish the deployed candidate (public digests and migration hashes only)
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-candidate-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.json
          retention-days: 90
