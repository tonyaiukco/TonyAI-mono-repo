name: Staging application deployment (smoke pending)
run-name: Staging candidate ${{ inputs.candidate_run_id }} — manifest review then deployment
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful staging candidate workflow run ID for this exact main SHA
        required: true
        type: string
      release_json:
        description: Reviewed application manifest; IDs/digests only, NEVER secret values
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: staging-application
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha256: ${{ steps.manifest.outputs.release_sha256 }}
    steps:
      - name: Require ephemeral JIT runner configuration
        id: runner-mode
        env:
          STAGING_RUNNER_MODE: ${{ vars.STAGING_RUNNER_MODE }}
        run: |
          if [ "${STAGING_RUNNER_MODE:-}" != 'ephemeral-jit' ]; then
            echo '::error::Set STAGING_RUNNER_MODE=ephemeral-jit after verifying the JIT provisioner.'
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require exact-candidate CI, integration and full E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/scripts/release_checks.py
      - name: Publish normalized manifest and hash for the reviewer
        id: manifest
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON: ${{ inputs.release_json }}
        run: python3 infra/scripts/prepare_release.py --preview
  deploy:
    needs: validate
    name: Deploy manifest ${{ needs.validate.outputs.release_sha256 }}
    if: github.ref == 'refs/heads/main' && vars.STAGING_RUNNER_MODE == 'ephemeral-jit'
    runs-on: tonyai-staging-eu
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require exact-candidate CI, integration and full E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/scripts/release_checks.py
      - name: Bind reviewed public inputs before cloud authentication
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON: ${{ inputs.release_json }}
          APPROVED_RELEASE_SHA256: ${{ needs.validate.outputs.release_sha256 }}
          BACKEND_JSON: ${{ vars.STAGING_BACKEND_JSON }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: python3 infra/scripts/prepare_release.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply the saved application plan and independently verify ARM readback
        run: >-
          bash infra/scripts/deploy-apps.sh
          --backend .infra-local/staging/backend.json
          --inputs .infra-local/staging/release.json --approved-apply
      - name: State the remaining acceptance gate
        run: echo 'Deployment readback passed. Owner-run exact-release browser/login/export/isolation smoke is REQUIRED; this run does not qualify a release.' >> "$GITHUB_STEP_SUMMARY"
