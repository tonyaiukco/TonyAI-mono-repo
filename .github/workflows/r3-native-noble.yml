name: R3 native Noble diagnostic

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Select policy collection, fixed snap leaf observation, or the existing installation diagnostic
        required: true
        type: choice
        default: diagnostic
        options:
          - diagnostic
          - policy-collection
          - snap-leaf-diagnostic
      source_sha:
        description: Exact owner-approved published commit (must equal the selected ref and workflow SHA)
        required: true
        type: string
      recipient:
        description: Owner-approved public SSH encryption key, without a comment (never a private key)
        required: true
        type: string
      recipient_sha256:
        description: SHA256 of the normalized public recipient plus one newline
        required: true
        type: string
      installation_policy:
        description: Optional separately reviewed PUBLIC fixture policy JSON (hashes only); empty retains original diagnostic
        required: false
        type: string
      installation_policy_sha256:
        description: Exact SHA256 of installation_policy UTF-8 bytes; separate maintenance execution approval required
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: r3-native-noble
  cancel-in-progress: false

jobs:
  native-noble:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One bounded disposable native fixture
        env:
          R3_PURPOSE: ${{ inputs.purpose }}
          R3_SOURCE_SHA: ${{ inputs.source_sha }}
          R3_RECIPIENT: ${{ inputs.recipient }}
          R3_RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
          R3_INSTALL_POLICY: ${{ inputs.installation_policy }}
          R3_INSTALL_POLICY_SHA256: ${{ inputs.installation_policy_sha256 }}
        run: python3 -I -B infra/scripts/r3_noble_fixture.py
      - name: Retain ciphertext and public correspondence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r3-native-noble-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r3-noble-publish/fixture-evidence.tar.age
            ${{ runner.temp }}/r3-noble-publish/binding.json
            ${{ runner.temp }}/r3-noble-publish/summary.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
