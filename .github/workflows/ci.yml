name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tonyai/db run generate

      - name: Build shared packages
        run: pnpm --filter @tonyai/shared-types run build

      # After Prisma generate and the shared-types build: the import resolver
      # follows `@tonyai/*` through their build output. Errors gate the merge;
      # warnings print without failing (today: six `exhaustive-deps` memoisation
      # warnings, tracked as a follow-up rather than swallowed).
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Candidate smoke contracts and lint scope
        run: node --test infra/tests/*.test.mjs

  # The database-layer security gate, and the only one that runs on every PR.
  #
  # Tenant isolation in this product is two-layer: the NestJS guard is the
  # primary control, Supabase RLS is defence-in-depth. Unit tests cover the
  # guard; NOTHING covered RLS in CI until this job, and the probes talk to
  # PostgREST directly — bypassing the guard entirely — so they are the only
  # mechanism that can prove the second layer holds on its own.
  #
  # It also runs the sweep that fails if any table in `public` ships with RLS
  # off, which is the failure a single new migration is always one step away
  # from.
  #
  # ~34 checks, no browser, no Next build, zero secrets: the local Supabase keys
  # are published demo values and are derived at job time rather than stored.
  # The full Playwright suite is deliberately NOT here — it is serial against one
  # shared database and would add 25-35 billed minutes to every push. It runs
  # nightly instead, in `e2e.yml`.
  rls-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/supabase-stack

      - name: RLS containment probes
        run: pnpm rls:probe

      - name: Diagnostics
        if: failure()
        run: |
          supabase status || true
          docker ps || true

  # Build, load and START these images against this disposable CI stack.
  # Cloud qualification uses separately built environment-bound digests.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/supabase-stack
      - run: pnpm exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      - name: Build and load API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: tonyai-api:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and load environment-bound web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: tonyai-web:ci
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Actual-image startup, login and browser/export smoke
        env:
          API_IMAGE: tonyai-api:ci
          WEB_IMAGE: tonyai-web:ci
        run: bash infra/scripts/local-image-smoke.sh
