name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tonyai/db run generate

      - name: Build shared packages
        run: pnpm --filter @tonyai/shared-types run build

      # After Prisma generate and the shared-types build: the import resolver
      # follows `@tonyai/*` through their build output. Errors gate the merge;
      # warnings print without failing (today: six `exhaustive-deps` memoisation
      # warnings, tracked as a follow-up rather than swallowed).
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Proof-of-build for the container images (no registry push, no cloud creds —
  # the Azure deploy pipeline (push to ACR + Container Apps via GitHub OIDC)
  # lands in the credit-dependent half of Phase 2).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-not-a-real-key
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
