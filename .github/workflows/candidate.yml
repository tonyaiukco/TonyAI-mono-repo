name: Staging candidate images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && vars.STAGING_RUNNER_MODE == 'ephemeral-jit'
    runs-on: tonyai-staging-eu
    environment: staging
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: https://${{ vars.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
      PREFIX: ${{ vars.STAGING_PREFIX }}
      ACA_DEFAULT_DOMAIN: ${{ vars.STAGING_ACA_DEFAULT_DOMAIN }}
      ACR_NAME: ${{ vars.STAGING_ACR_NAME }}
      ACR_HOST: ${{ vars.STAGING_ACR_NAME }}.azurecr.io
      RESOURCE_GROUP: ${{ vars.STAGING_RESOURCE_GROUP }}
      API_ORIGIN: https://${{ vars.STAGING_PREFIX }}-staging-api.${{ vars.STAGING_ACA_DEFAULT_DOMAIN }}
      WEB_ORIGIN: https://${{ vars.STAGING_PREFIX }}-staging-web.${{ vars.STAGING_ACA_DEFAULT_DOMAIN }}
      # Public, build-time browser key; never a backend/service-role key.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require exact-candidate CI, integration and full E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/scripts/release_checks.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build environment-bound images and scan the exact pushed web digest
        run: |
          mkdir -p .infra-local/staging
          bash infra/scripts/build-images.sh "$GITHUB_SHA" .infra-local/staging/candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-candidate-${{ github.sha }}
          path: .infra-local/staging/candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
