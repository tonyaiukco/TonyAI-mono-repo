name: Sweden QA preparation
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/qa-*.yml', 'apps/api/Dockerfile']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/qa-*.yml', 'apps/api/Dockerfile']
permissions:
  contents: read
jobs:
  qa-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - name: QA policy and negative tests
        run: |
          python3 -m venv "$RUNNER_TEMP/qa-tests"
          "$RUNNER_TEMP/qa-tests/bin/python" -m pip install --only-binary=:all: --require-hashes -r infra/tests/requirements.txt
          python3 infra/scripts/qa_policy.py
          TERRAFORM_TEST_BINARY="$(command -v terraform)" "$RUNNER_TEMP/qa-tests/bin/python" -m unittest discover -s infra/tests -p 'test_qa_*.py' -v
      - name: Credential-free QA Terraform checks
        run: |
          for root in foundation/qa application/qa; do
            terraform -chdir="infra/terraform/$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/terraform/$root" validate -no-color
            terraform -chdir="infra/terraform/$root" test -no-color
          done
          terraform -chdir=infra/terraform/application/qa test -json -verbose > "$RUNNER_TEMP/qa-plan.jsonl"
          python3 infra/scripts/qa_plan_contract.py "$RUNNER_TEMP/qa-plan.jsonl"
          terraform -chdir=infra/terraform/foundation/qa test -json -verbose > "$RUNNER_TEMP/qa-foundation-plan.jsonl"
          python3 infra/scripts/qa_foundation_mock.py "$RUNNER_TEMP/qa-foundation-plan.jsonl"
          python3 infra/scripts/qa_runtime_mock.py --terraform "$(command -v terraform)"
          python3 infra/scripts/qa_oidc_mock.py --terraform "$(command -v terraform)"
          python3 infra/scripts/qa_deployment_mock.py --terraform "$(command -v terraform)"
          terraform fmt -check -recursive infra/terraform
          terraform fmt -check infra/tests/fixtures/qa-runtime.tftest.hcl infra/tests/fixtures/qa-oidc.tftest.hcl infra/tests/fixtures/qa-deployment.tftest.hcl
