name: Supabase local stack
description: >
  Bring up the local Supabase stack, apply migrations, seed it, and export every
  key the API, the web app and the probes need — all as job env, no secrets.

inputs:
  cli-version:
    description: >
      Pinned Supabase CLI version. NOT cosmetic: newer CLIs sign asymmetrically
      and stopped emitting some legacy key names, and this repo's API runs an
      HS256-capable `auto` scheme that wants JWT_SECRET. Must match the reviewed
      CLI/database policy; image identity is checked before migrations.
    required: false
    default: 2.121.0

runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@v1
      with:
        version: ${{ inputs.cli-version }}

    - name: Log in to GHCR for public Supabase images
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # Every job that starts this stack pulled the reviewed database image (the stack's largest)
    # from GHCR, and on a busy day the registry's limits refused it (2026-10-15, 2026-10-26).
    # Only that image is cached, keyed by its reviewed policy, and it is accepted solely by its
    # reviewed config digest (prepare) and checked again running (verify). The other stack
    # images are never cached: they run before verify. `docker load` restores every tag an
    # archive holds, so an archive that changes any tag but the reviewed database tag (one
    # this action did not write) is refused at load. A load that fails just pulls.
    - name: Restore the cached database image
      id: image-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/supabase-db-image.tar
        key: supabase-db-image-v1-${{ runner.os }}-${{ hashFiles('infra/selfhost/database-image-policy.json') }}

    - name: Load the cached database image
      if: steps.image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        archive="$RUNNER_TEMP/supabase-db-image.tar"
        expected="ghcr.io/$(python3 -c 'import json; print(json.load(open("infra/selfhost/database-image-policy.json"))["image_tag"])')"
        images() { docker image ls --no-trunc --format '{{.Repository}}:{{.Tag}} {{.ID}}' | sort; }
        before="$(images)"
        docker load --quiet --input "$archive" >/dev/null \
          || echo "::warning::The cached database image did not load; pulling instead."
        after="$(images)"
        rm -f "$archive"
        added="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | cut -d' ' -f1)"
        removed="$(comm -23 <(printf '%s\n' "$before") <(printf '%s\n' "$after"))"
        if [ -n "$removed" ] || { [ -n "$added" ] && [ "$added" != "$expected" ]; }; then
          echo "::error::The cached archive changed image tags other than the reviewed database tag; refusing it."
          exit 1
        fi

    # `studio`, `mailpit` and `realtime` are developer conveniences; `supavisor`
    # is the connection pooler, disabled in config.toml anyway; `edge-runtime`
    # serves functions this project has none of. Everything the probes and the
    # seed touch stays: postgres, kong, gotrue, postgrest, storage-api.
    - name: Prepare the reviewed database image
      shell: bash
      env:
        SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      run: python3 infra/scripts/ci_database_image.py prepare

    - name: Start Supabase
      shell: bash
      env:
        SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      run: supabase start -x studio,mailpit,realtime,edge-runtime,supavisor

    - name: Verify the running database image before migrations
      shell: bash
      env:
        SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      run: python3 infra/scripts/ci_database_image.py verify

    # Only after the running database passed verify, and only on a cache miss: the reviewed
    # tag, which prepare set from the reviewed digest and verify found running.
    - name: Save the database image for later runs
      id: image-save
      if: steps.image-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        tag="ghcr.io/$(python3 -c 'import json; print(json.load(open("infra/selfhost/database-image-policy.json"))["image_tag"])')"
        docker save --output "$RUNNER_TEMP/supabase-db-image.partial" "$tag"
        mv "$RUNNER_TEMP/supabase-db-image.partial" "$RUNNER_TEMP/supabase-db-image.tar"

    # Never a partial archive: only a save that completed is uploaded.
    - name: Cache the database image
      if: steps.image-cache.outputs.cache-hit != 'true' && steps.image-save.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/supabase-db-image.tar
        key: ${{ steps.image-cache.outputs.cache-primary-key }}

    - name: Remove the image archive
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/supabase-db-image.tar" "$RUNNER_TEMP/supabase-db-image.partial"

    # Derived, never hardcoded. The local keys ARE well-known demo values (so no
    # GitHub secret is involved at all), but their exact bytes differ per CLI
    # version — baking them in is how storage and auth break silently on a bump.
    # This is the same read `scripts/bootstrap.sh` does.
    - name: Export Supabase env
      shell: bash
      run: |
        set -euo pipefail
        # Public disposable fixture, shared by seed, E2E, RLS and image smoke.
        # Current Auth enforces the configured minimum even for admin creation.
        echo "TONYAI_TEST_PASSWORD=TonyAI-CI!2026" >> "$GITHUB_ENV"
        eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET|API_URL|DB_URL)=')"
        for required in ANON_KEY SERVICE_ROLE_KEY API_URL DB_URL; do
          if [ -z "${!required:-}" ]; then
            echo "::error::supabase status did not report $required — the pinned CLI has changed its output. See scripts/bootstrap.sh, which guards the same thing."
            exit 1
          fi
        done

        {
          echo "DATABASE_URL=$DB_URL"
          echo "DIRECT_URL=$DB_URL"
          echo "SUPABASE_URL=$API_URL"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          # What the probes read.
          echo "E2E_SUPABASE_URL=$API_URL"
          echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
          echo "E2E_SUPABASE_SERVICE_KEY=$SERVICE_ROLE_KEY"
          # What the web app inlines AT BUILD TIME.
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          echo "NEXT_PUBLIC_API_BASE_URL=http://localhost:3001/api/v1"
          # The API. Without ALLOW_INSECURE_LOCAL_AUTH the API refuses to boot
          # and the failure surfaces as a 120s health-check timeout.
          echo "PORT=3001"
          echo "WEB_ORIGIN=http://localhost:3000"
          echo "ALLOW_INSECURE_LOCAL_AUTH=true"
        } >> "$GITHUB_ENV"

        if [ -n "${JWT_SECRET:-}" ]; then
          echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "SUPABASE_JWT_SCHEME=auto" >> "$GITHUB_ENV"
        else
          echo "::notice::No JWT_SECRET from this CLI — falling back to the JWKS scheme."
          echo "SUPABASE_JWT_SCHEME=jwks" >> "$GITHUB_ENV"
        fi

    # `deploy`, never `reset`: a `migrate reset` drops the PostgREST grants
    # migration the probes depend on, and config.toml points [db.seed] at a
    # seed.sql that does not exist, so a CLI-side reset would run nothing.
    - name: Migrate and seed
      shell: bash
      run: |
        set -euo pipefail
        # The seed imports @tonyai/shared-types at RUNTIME through its `dist`,
        # so a workspace link is not enough — it has to be built first. Same
        # step the `build` job runs before typecheck.
        pnpm --filter @tonyai/shared-types run build
        pnpm --filter @tonyai/db run deploy
        pnpm --filter @tonyai/db run generate
        pnpm --filter @tonyai/db run seed
